<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding -->
  <meta charset="UTF-8">

  <!-- Helps the webpage display correctly on different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the title shown in the browser tab -->
  <title>RT Tracker</title>

  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Connects the JavaScript file -->
  <script src="script.js" defer></script>
</head>

<body>
<!-- Top dark bar containing Streak, D/W/M buttons, and timeframe label -->
  <header class="top-bar">
    <div class="streak-display">Streak <span id="streak-count">0</span></div>

    <!-- Timeframe selector buttons -->
    <div class="timeframe-buttons">
      <button id="btn-d" class="time-btn active" onclick="setTimeframe('D')">D</button>
      <button id="btn-w" class="time-btn" onclick="setTimeframe('W')">W</button>
      <button id="btn-m" class="time-btn" onclick="setTimeframe('M')">M</button>
    </div>

    <!-- Displays the selected timeframe and value -->
    <div id="timeframe-label" class="timeframe-label">Today 0</div>
  </header>
  <!-- Main middle section containing the app title and daily goal card -->
  <main class="main-section">
    <h1 class="app-title">RT Tracker</h1>
    <!-- Bottom counters for Steps and Kilometers -->
    <div class="stats-row">
      <div class="stat-item">Steps <span id="steps-count">0</span></div>
      <div class="stat-item">Km <span id="km-count">0</span></div>
    </div>

    <!-- Dark card showing the daily step goal -->
    <div class="goal-card">
      <p class="goal-title">Daily running goal:</p>
      <p class="goal-amount"><span id="daily-goal">5,000</span> steps</p>
    </div>
  </main>
</body>

</html>
